name: Linux debugger checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            sanitizers: "OFF"
          - configuration: Release
            sanitizers: "OFF"
          - configuration: Debug
            sanitizers: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcapstone-dev python3
      - name: Configure, build and test
        env:
          SDB_REQUIRE_PTRACE: "1"
        run: bash scripts/ci.sh --build-type '${{ matrix.configuration }}' --sanitizers '${{ matrix.sanitizers }}'
      - name: Preserve logs and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.configuration }}-sanitizers-${{ matrix.sanitizers }}
          path: |
            build/ci/**/configure.log
            build/ci/**/build.log
            build/ci/**/test.log
            build/ci/**/results.xml
            build/ci/**/summary.txt
            build/ci/**/Testing/Temporary/LastTest.log
          if-no-files-found: warn
