name: Linux debugger checks
on:
  push:
  pull_request:

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            sanitizers: "OFF"
          - configuration: Release
            sanitizers: "OFF"
          - configuration: Debug
            sanitizers: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libcapstone-dev python3
      - name: Configure, build and test
        env:
          SDB_REQUIRE_PTRACE: "1"
          SDB_REQUIRE_NATIVE_WATCHSTEP: "1"
        run: ./scripts/ci.sh --build-type '${{ matrix.configuration }}' --sanitizers '${{ matrix.sanitizers }}'
      - name: Preserve logs, JUnit results and skip summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.configuration }}-sanitizers-${{ matrix.sanitizers }}
          path: |
            build/ci/**/configure.log
            build/ci/**/build.log
            build/ci/**/test.log
            build/ci/**/results.xml
            build/ci/**/summary.txt
            build/ci/**/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  public-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the public development image
        run: docker build --pull -t sdb-public:ci .
      - name: Exercise the source copied into the image
        run: |
          mkdir -p build/container-ci
          docker run --rm --init --cap-add SYS_PTRACE \
            -e SDB_REQUIRE_PTRACE=1 -e SDB_REQUIRE_NATIVE_WATCHSTEP=1 \
            -e SDB_BUILD_ROOT=/tmp/sdb-ci \
            --mount "type=bind,source=$PWD/build/container-ci,target=/tmp/sdb-ci" \
            sdb-public:ci bash -lc './scripts/ci.sh --build-type Release --sanitizers OFF'
      - name: Preserve container validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-container-Release
          path: |
            build/container-ci/**/configure.log
            build/container-ci/**/build.log
            build/container-ci/**/test.log
            build/container-ci/**/results.xml
            build/container-ci/**/summary.txt
            build/container-ci/**/Testing/Temporary/LastTest.log
          if-no-files-found: warn
